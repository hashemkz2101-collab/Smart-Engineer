name: Lock tool (temporary)
on:
  push:
    branches: [p2-lock-tool]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv python install 3.14.10
      - run: uv lock
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet || git commit -m "Regenerate uv.lock (shapely + pymysql)"
          git push
